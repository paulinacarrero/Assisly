<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assisly</title>
    <link rel="stylesheet" href="styles.css">

    <!-- icono del ojo-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* Solo añadimos esto para que las opciones se vean en línea como en tu imagen */
        .opciones-roles {
            padding-left: 70px;
            display: flex;
            justify-content: flex-start;
            gap: 20px;
            
            color: rgb(0, 0, 0); /* Para que el texto sea visible sobre tu fondo oscuro */
            font-size: 14px;
        }
        .opciones-roles label {
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .opciones-roles input {
            margin-right: 5px;
            accent-color: #a100ff; /* Esto da el color púrpura de la imagen al circulito */
        }
    </style>
</head>
<body>
    
<div class="login-container">

    <img src="imagenes assisly/logo.png" class="logo">

    <h2>Bienvenido a Assisly</h2>
    <p>Inicia sesión para continuar</p>
    
    <form id="loginForm">
        <input type="email" name="email" placeholder="Correo electrónico" required minlength="5">

    <div class="contraseña">
        <input type="password" name="password" placeholder="Contraseña" required>
        <i class="fa-solid fa-eye-slash"></i>
    </div>

        <!-- LAS TRES OPCIONES SOLICITADAS -->
        <div class="opciones-roles">
            <label><input type="radio" name="rol" value="estudiante" checked> Estudiante</label>
            <label><input type="radio" name="rol" value="docente"> Docente/Administrativo</label>
        </div>

        <button type="submit" class="btn-login">
            INICIAR SESIÓN
        </button>
    </form>

    <p>¿No tienes cuenta? <a href="registro.html">Registrarse</a></p>
    <div id="estado"></div>
</div>

<script>

const universidadLat = 6.2622265956705805; 
const universidadLon = -75.58902415099524;

const RADIO_PERMITIDO = 100;

function calcularDistancia(lat1, lon1, lat2, lon2) {

    const R = 6371e3;

    const φ1 = lat1 * Math.PI / 180;
    const φ2 = lat2 * Math.PI / 180;

    const Δφ = (lat2 - lat1) * Math.PI / 180;
    const Δλ = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
        Math.cos(φ1) * Math.cos(φ2) *
        Math.sin(Δλ / 2) * Math.sin(Δλ / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    return R * c;
}
document.querySelector(".btn-login").addEventListener("click", (e) => {

    e.preventDefault();

    const estado = document.getElementById("estado");

    if (!navigator.geolocation) {
        estado.innerHTML = "Tu navegador no soporta GPS";
        return;
    }

    navigator.geolocation.getCurrentPosition(

        (position) => {

            const usuarioLat = position.coords.latitude;
            const usuarioLon = position.coords.longitude;

            const distancia = calcularDistancia(
                usuarioLat,
                usuarioLon,
                universidadLat,
                universidadLon
            );

            if (distancia <= RADIO_PERMITIDO) {

                alert("Asistencia permitida");

                // VERIFICAR ROL SELECCIONADO
                const rolSeleccionado = document.querySelector('input[name="rol"]:checked').value;

                if (rolSeleccionado === "docente") {

                    window.location.href = "docente.html";

                } else {

                    window.location.href = "codigoQR.html";

                }

            } else {

                estado.innerHTML = `
                    ❌ Debes estar dentro de la universidad
                `;

                alert("Acceso bloqueado");

            }

        },

        (error) => {

            console.log(error);

            estado.innerHTML = "Debes permitir ubicación";

        },

        {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        }

    );

});
</script>

<script src="login.js"></script>
</body>
</html>
